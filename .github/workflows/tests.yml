name: StudentTrack tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: studenttrack
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: studenttrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studenttrack -d studenttrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STUDENTTRACK_TEST_DATABASE_URL: postgresql+psycopg://studenttrack:test_password@127.0.0.1:5432/studenttrack_test

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/unit tests/integration
      - run: node --test tests/frontend/dashboard.test.mjs